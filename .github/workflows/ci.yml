name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  # Code quality checks
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip and tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install linting tools
        run: |
          pip install "black>=23.0.0,<24.0.0"
          pip install "flake8>=6.0.0,<7.0.0"
          pip install "isort>=5.12.0,<6.0.0"
          pip install "mypy>=1.0.0,<2.0.0"

      - name: Run black (code formatting)
        run: black --check src/ tests/
        continue-on-error: true

      - name: Run isort (import sorting)
        run: isort --check-only src/ tests/
        continue-on-error: true

      - name: Run flake8 (linting)
        run: flake8 src/ tests/ --max-line-length=100 --ignore=E203,W503

      - name: Run mypy (type checking)
        run: mypy src/ --ignore-missing-imports
        continue-on-error: true

  # Run tests
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install core dependencies first
        run: |
          # Instalar pacotes principais primeiro para evitar conflitos
          pip install "numpy>=1.23.0,<1.25.0"
          pip install "pandas>=1.5.0,<2.0.0"
          pip install "scikit-learn>=1.2.0,<1.4.0"

      - name: Install remaining dependencies
        run: |
          # Instalar o resto com legacy resolver se necessário
          pip install --use-deprecated=legacy-resolver -r requirements.txt

      - name: Install project in development mode
        run: pip install -e .

      - name: Run tests with pytest
        run: |
          pytest tests/ \
            --verbose \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --junitxml=junit/test-results-${{ matrix.python-version }}.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit/test-results-*.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/

  # Security scanning (NEW)
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Bandit security check
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-results.json || true

      - name: Run Safety dependency check
        run: |
          pip install safety
          safety check -r requirements.txt --output safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-results.json
            safety-report.json

  # Build Docker image
  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: pl-predictor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test Docker image
        run: |
          # Start container in background
          docker run -d -p 8000:8000 --name test-container pl-predictor:${{ github.sha }}
          
          # Improved health check with timeout
          timeout=60
          interval=5
          elapsed=0
          
          until curl -f http://localhost:8000/health 2>/dev/null || [ $elapsed -ge $timeout ]; do
            sleep $interval
            elapsed=$((elapsed + interval))
            echo "Waiting for container to be healthy... ($elapsed/$timeout seconds)"
          done
          
          if [ $elapsed -ge $timeout ]; then
            echo "Container failed to become healthy within $timeout seconds"
            docker logs test-container
            exit 1
          else
            echo "Container is healthy"
          fi
          
          # Stop container
          docker stop test-container
          docker rm test-container

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build documentation
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "mkdocs>=1.4.0,<1.6.0"
          pip install "mkdocs-material>=9.0.0,<10.0.0"
          pip install "mkdocstrings[python]>=0.20.0,<0.30.0"

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Deploy documentation to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

  # Summary
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, docker, docs]
    if: always()
    timeout-minutes: 2

    steps:
      - name: Check results
        run: |
          echo "CI/CD Pipeline Results"
          echo "========================="
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Docker: ${{ needs.docker.result }}"
          echo "Docs: ${{ needs.docs.result }}"
          echo ""
          
          if [ "${{ needs.lint.result }}" == "failure" ] || \
             [ "${{ needs.test.result }}" == "failure" ] || \
             [ "${{ needs.docker.result }}" == "failure" ]; then
            echo "CI Pipeline Failed - Critical checks failed"
            exit 1
          elif [ "${{ needs.security.result }}" == "failure" ] || \
               [ "${{ needs.docs.result }}" == "failure" ]; then
            echo " CI Pipeline Partially Failed - Non-critical checks failed"
            exit 0  # Não falha o pipeline por segurança/docs
          else
            echo "CI Pipeline Passed Successfully"
          fi

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [summary]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        run: |
          scp app.tar.gz usuario@servidor:/app
          ssh usuario@servidor "docker-compose up -d"