[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-match-predictor"
version = "0.1.0"
description = "Premier League match outcome predictor using Machine Learning"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE*", "COPYING*", "COPYING.LESSER*"]
authors = [
    {name = "Miguel Vila", email = "luismiguelvila@gmail.com"}
]
maintainers = [
    {name = "Miguel Vila", email = "luismiguelvila@gmail.com"}
]
keywords = ["football", "soccer", "prediction", "machine-learning", "premier-league", "sports-analytics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "soccerdata>=1.4.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.2.0",
    "joblib>=1.2.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.21.0",
    "pydantic>=2.0.0",
]
dvc = [
    "dvc>=2.0.0",
    "dvc-s3>=2.0.0",
]
gui = [
    "PyQt5>=5.15.0",
]
viz = [
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.0.0",
]
docs = [
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.20.0",
]
all = [
    "pl-match-predictor[api,dvc,gui,viz,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/miguelvila02/pl-match-predictor"
Documentation = "https://miguelvila02.github.io/pl-match-predictor"
Repository = "https://github.com/miguelvila02/pl-match-predictor.git"
"Bug Tracker" = "https://github.com/miguelvila02/pl-match-predictor/issues"
Changelog = "https://github.com/miguelvila02/pl-match-predictor/blob/main/CHANGELOG.md"

[project.scripts]
pl-fetch-data = "src.server.data.getdata.fetch_real_matches:main"
pl-train = "src.server.model.modelbuild.predictor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]  # Look for packages inside the 'src' directory
include = ["server*", "app*", "client*"]  # Explicitly include your packages
exclude = ["tests*", "docs*", "build*", "dist*"]  # Exclude non-package directories

[tool.setuptools_scm]
# This configures automatic version detection from git tags
write_to = "src/_version.py"
version_scheme = "post-release"
local_scheme = "node-and-date"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.tox
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".eggs",
]
